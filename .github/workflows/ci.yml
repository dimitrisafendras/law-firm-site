name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# A superseded run on the same ref has nothing left to tell us.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` runs `tsc -b` first, so a separate typecheck step would
      # only duplicate it. Types are covered by the build job below.

      - name: Test
        run: npm run test

      # src/lib/supabase.ts throws at module load when either variable is
      # missing, and the prerender imports the whole app — so the build needs
      # real values, not a stub. (An earlier version of this job omitted them
      # deliberately, on the theory that it exercised the site's ability to
      # render from its shipped locale files with the database unreachable.
      # That invariant does not exist at build time: the throw is by design and
      # fires long before any component renders.)
      - name: Build and prerender
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
