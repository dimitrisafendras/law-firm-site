name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# A superseded run on the same ref has nothing left to tell us.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` runs `tsc -b` first, so a separate typecheck step would
      # only duplicate it. Types are covered by the build job below.

      - name: Test
        run: npm run test

      # Builds without Supabase secrets on purpose: the site must render its
      # shipped copy when the database is unreachable, and this is the only
      # place that invariant gets exercised. The prerender in `postbuild` fails
      # loudly if any component reaches for a provider that is not there.
      - name: Build and prerender
        run: npm run build
