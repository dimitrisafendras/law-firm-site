<!doctype html>

    <meta charset="UTF-8" />

    <meta name="description" content="VKM Legal & Advisory — super prime legal counsel in Athens. Real estate, startup & venture capital, maritime, and cryptocurrency law for ambitious clients." />
    <!-- The default palette's `--bg` (Ultramarine dark / `lapis`), which is what
         browser chrome tints itself with before the page paints. Static, so it
         describes the default rather than whatever palette the reader has
         chosen; keep it in step with DEFAULT_PALETTE_ID in src/theme/palettes.ts. -->
    <meta name="theme-color" content="#0A1836" />

    <!--
      Palette, applied before the first paint.

      The stylesheet paints the default (Obsidian) from bare :root, so a visitor
      who chose a light palette would otherwise see a flash of near-black before
      React boots and ThemeProvider stamps the attribute. This runs in <head>,
      ahead of the stylesheet, and costs one localStorage read.

      The key is duplicated from THEME_STORAGE_KEY in src/lib/theme/context.ts —
      an inline script cannot import it. The id is pattern-checked rather than
      matched against the registry (also unimportable here); an id that survives
      the check but is not a real palette simply matches no block, and the page
      falls back to the :root default.
    -->
    <script>
      (function () {
        try {
          var id = localStorage.getItem('law-firm-site:palette');
          if (id && /^[a-z][a-z0-9-]{0,31}$/.test(id)) {
            document.documentElement.setAttribute('data-theme', id);
          }
        } catch (e) {
          /* Private window with site data blocked. Default palette it is. */
        }

        /*
          Reloading the page puts you back at the hero, not wherever you had
          scrolled to. The browser's own restore fights everything this page
          does on arrival — the hero's entrance choreography plays to nobody,
          and the scroll-driven exits start mid-flight — and it restores a
          position the URL does not describe, so the same address gives two
          different first screens.

          It has to be set here rather than in main.tsx: the restore happens
          before a deferred module script gets a turn.

          An explicit `#section` in the URL is untouched by this — that is a
          fragment navigation, not a restore, and the browser still honours it
          (as does HomePage's own align effect). Back and forward lose their
          restored offsets too, which is the reason src/utils/sectionAnchor.ts
          exists: it stamps the section you were reading onto the history entry
          before you leave it, so returning lands you there by anchor.
        */
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      })();
    </script>
    <link rel="canonical" href="https://dimitrisafendras.github.io/law-firm-site/" />
