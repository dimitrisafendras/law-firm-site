<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!--
    VKM monogram, matching src/assets/VkmLogo.tsx.

    Literal hex, not var(--brand-*): a favicon is fetched as a standalone
    document and never sees the app's stylesheet, so a custom property here
    resolves to nothing. Same values as the `brand` block in tokens.ts — move
    them there and they have to be copied here by hand.

    No keyline: the artwork's 8px white stroke ran the three glyphs together
    into a smudge at small sizes, which is worse here than anywhere.

    A generic stack rather than Jura, for the same standalone reason — the
    site's webfonts are not loaded in this context, so this asks for whatever
    sans the platform has instead of pretending otherwise.
  -->
  <rect width="48" height="48" rx="10" fill="#0F1A2E"/>
  <text x="24" y="31" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="19" font-weight="700" letter-spacing="0.5">
    <tspan fill="#7FA8CC">V</tspan><tspan fill="#89CFF0">K</tspan><tspan fill="#7FA8CC">M</tspan>
  </text>
</svg>
