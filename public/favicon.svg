<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="VKM Legal">
  <!--
    Scale of justice, baby blue on the site's navy ground.

    Literal hex, not a CSS custom property: a favicon is fetched as a standalone
    document and never sees the app's stylesheet, so var() resolves to nothing
    here. #BCE8FF is the accent from tokens.ts and #0F1A2E the page ground;
    change either there and it has to be changed here by hand.

    Geometry, not type, which is what makes it work at 16px — the wordmark
    depends on a font this document does not get, and its three glyphs close
    into a single dot at tab size.

    Mirrors ScaleOfJustice in src/assets/illustrations.tsx, scaled 0.73 and
    inset so the drawing sits inside the rounded plate rather than touching it.
  -->
  <rect width="48" height="48" rx="10" fill="#0F1A2E"/>
  <g transform="translate(6.5,5.5) scale(0.73)" stroke="#BCE8FF" fill="none">
    <line x1="24" y1="6" x2="24" y2="42" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="24" cy="6" r="3" stroke-width="2"/>
    <line x1="6" y1="16" x2="42" y2="16" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M6 16L2 28H18L14 16" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M2 28C2 30 6 32 10 32C14 32 18 30 18 28" stroke-width="1.5"/>
    <path d="M34 16L30 28H46L42 16" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M30 28C30 30 34 32 38 32C42 32 46 30 46 28" stroke-width="1.5"/>
    <rect x="14" y="42" width="20" height="3" rx="1.5" stroke-width="1.5"/>
  </g>
</svg>
