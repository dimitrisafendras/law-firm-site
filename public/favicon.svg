<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!--
    VKM monogram (mirrors VkmMark in src/assets/VkmLogo.tsx).

    Literal values, not var(--brand-*): a favicon is fetched as a standalone
    document, so it never sees the app's stylesheet and any custom property
    would resolve to nothing. These are the same values tokens.ts holds — if the
    brand colours move there, they have to be copied here by hand.

    LEGAL is dropped: at 16px its 9px tracking closes into a smudge.

    The font is a generic stack for the same reason — the site's webfonts are
    not loaded in this context, so this asks for whatever sans the platform has
    rather than pretending otherwise.
  -->
  <rect width="48" height="48" rx="10" fill="#0B1524"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     font-size="19" font-weight="600" text-anchor="middle" dominant-baseline="central">
    <text x="11" y="25" fill="#7FA8CC">V</text>
    <text x="24" y="25" fill="#89CFF0">K</text>
    <text x="38" y="25" fill="#7FA8CC">M</text>
  </g>
</svg>
